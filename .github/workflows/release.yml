# Builds the Windows installer and publishes a GitHub release with the updater's latest.json.
# Start it by pushing a tag: git tag v0.1.0 && git push origin v0.1.0
# The tag must match "version" in src-tauri/tauri.conf.json.
#
# Repository secrets: TAURI_SIGNING_PRIVATE_KEY (contents of the updater key file) and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty if the key has none).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: PoE Trade Overlay ${{ github.ref_name }}
          releaseBody: See the commits since the previous release.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
