<div class="flex h-full flex-col overflow-hidden rounded-lg border border-zinc-700 bg-zinc-900/95 font-sans text-sm text-zinc-200 shadow-xl">
  <header class="flex items-center gap-2 border-b border-zinc-800 px-3 py-2">
    <span class="flex-1 font-semibold text-zinc-50">Item text</span>
    @if (item(); as current) {
      <span class="text-xs text-zinc-500">{{ current.elapsedMs }} ms</span>
    }
    <button class="rounded px-2 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-100" (click)="close()">✕</button>
  </header>

  <!-- Click test: the counter must grow while the game keeps focus. -->
  <button
    class="mx-3 mt-3 rounded bg-zinc-800 px-3 py-1.5 text-left hover:bg-zinc-700"
    (click)="clicks.set(clicks() + 1)"
  >
    Click test: {{ clicks() }}
  </button>

  <pre class="m-3 min-h-0 flex-1 overflow-auto rounded bg-zinc-950 p-2 font-mono text-xs whitespace-pre-wrap">{{ item()?.text ?? 'No item yet.' }}</pre>
</div>
